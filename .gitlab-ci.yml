stages:
  - validate
  - release
  - deploy

validate-taxonomy:
  stage: validate
  tags: [kt-gitlab-runner-docker]
  image: python:3.12-slim
  services:
    - name: postgres:17.6
      alias: db
  variables:
    POSTGRES_DB: postgres
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci
    POSTGRES_HOST: db
    POSTGRES_PORT: '5432'
    SECRET_KEY: ci-only-not-secret-do-not-use-in-prod
    DJANGO_SETTINGS_MODULE: ai4deliberation_backend.settings.staging
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - python manage.py migrate --noinput
    - python manage.py seed_taxonomy
    - python manage.py validate_taxonomy

bump-guard:
  stage: validate
  tags: [kt-gitlab-runner-docker]
  image: alpine:latest
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
    - git fetch origin main:refs/remotes/origin/main
  script:
    - |
      if git diff --name-only origin/main HEAD | grep -q '^topic_extraction/taxonomy_data\.py$'; then
        OLD=$(git show origin/main:topic_extraction/taxonomy_data.py | grep '^TAXONOMY_VERSION' | head -1)
        NEW=$(grep '^TAXONOMY_VERSION' topic_extraction/taxonomy_data.py | head -1)
        if [ "$OLD" = "$NEW" ]; then
          echo "ERROR: topic_extraction/taxonomy_data.py changed but TAXONOMY_VERSION did not bump."
          echo "Old: $OLD"
          echo "New: $NEW"
          exit 1
        fi
        echo "OK: TAXONOMY_VERSION bumped from '$OLD' to '$NEW'."
      else
        echo "taxonomy_data.py unchanged in this MR — bump check skipped."
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

release:
  stage: release
  tags: [deploy-rnd-staging]
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker build -t ${CI_REGISTRY}/${CI_PROJECT_PATH}:latest -f docker/web/Dockerfile .
    - docker build -t ${CI_REGISTRY}/${CI_PROJECT_PATH}:nginx -f docker/nginx/Dockerfile .
    - docker push "${CI_REGISTRY}/${CI_PROJECT_PATH}":latest
    - docker push "${CI_REGISTRY}/${CI_PROJECT_PATH}":nginx
  after_script:
    - docker logout ${CI_REGISTRY}/${CI_PROJECT_PATH}
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:
  stage: deploy
  tags:
    - deploy-rnd-staging
  environment: staging
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - cat $ENV_STAGING >> .env
    - docker compose -f docker-compose-staging.yml stop
    - docker compose -f docker-compose-staging.yml pull
    - docker compose -f docker-compose-staging.yml up -d
  after_script:
    - docker logout ${CI_REGISTRY}/${CI_PROJECT_PATH}
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
