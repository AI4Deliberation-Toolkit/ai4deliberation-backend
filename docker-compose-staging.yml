services:
  web:
    container_name: ai4deliberation-back
    image: git.konnektable.com:5050/rnd/rnds2025/ai4deliberation-backend:latest
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
    restart: always
    # Don't add --access-logfile: it would route uvicorn.access (client IPs, URLs) to stdout with no
    # redaction. nginx's access log already covers access.
    command: gunicorn -k uvicorn_worker.UvicornWorker -w 4 -b 0.0.0.0:8000 ai4deliberation_backend.asgi:application --timeout 300
    env_file:
      - .env
    volumes:
      - static_volume:/usr/src/app/staticfiles/
      - media_volume:/usr/src/app/media/
      - .env:/usr/src/app/.env
    environment:
      DJANGO_SETTINGS_MODULE: ai4deliberation_backend.settings.staging
    depends_on:
      - db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    container_name: ai4deliberation-back-db
    restart: always
    image: postgres:17.6
    env_file:
      - .env
    volumes:
      - db_volume:/var/lib/postgresql/data/
    command: postgres -c max_connections=1000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    container_name: ai4deliberation-back-nginx
    restart: always
    image: git.konnektable.com:5050/rnd/rnds2025/ai4deliberation-backend:nginx
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    ports:
      - 2026:80
    volumes:
      - static_volume:/home/app/web/static/
      - media_volume:/home/app/web/media/
    depends_on:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  static_volume:
  media_volume:
  db_volume:
