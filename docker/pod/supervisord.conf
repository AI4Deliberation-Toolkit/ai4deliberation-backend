; Pod process manager (spec §3.3). The entrypoint execs supervisord, which becomes PID 1 and gets
; Runpod's SIGTERM. It stops the programs one at a time in reverse priority (app, backup,
; postgres) within Runpod's ~15 s: ~4 s + ~1 s + ~8 s, plus up to ~1 s of polling per phase (spec §6).

[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
; With nodaemon, supervisord already prints its own start/stop lines (with timestamps) to the
; container log; a log file would print them twice.
logfile=/dev/null
logfile_maxbytes=0

; supervisorctl over a local socket, for the runbook's manual restore (supervisorctl stop app backup postgres).
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:postgres]
; Environment allow-list (lib.sh postgres_env_cmd): the app's secrets stay out of Postgres's environment.
command=bash -c 'source /usr/src/app/docker/pod/lib.sh && postgres_env_cmd && exec "${POSTGRES_ENV[@]}" gosu postgres postgres -D "$PGDATA"'
priority=10
autorestart=true
; SIGINT = fast shutdown; with archiving on, Postgres archives the last WAL before it exits.
stopsignal=INT
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:backup]
command=/usr/src/app/docker/pod/backup-loop.sh
priority=20
autorestart=true
; A half-made base backup has no COMPLETE and is ignored, so the loop is simply killed.
stopsignal=TERM
stopwaitsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:app]
command=/usr/src/app/docker/pod/app-start.sh
directory=/usr/src/app
priority=30
autorestart=true
startretries=10
; gunicorn --graceful-timeout 3 (app-start.sh) finishes in-flight requests within this.
stopsignal=TERM
stopwaitsecs=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
