# Postgres settings managed by the pod image (spec §5.1). The entrypoint writes this file to
# $PGDATA/conf.d/gateway.conf on every boot, so a new image's settings also apply to restored data
# and edits made inside the pod don't survive a restart. ${POSTGRES_PORT} is filled in at boot.
listen_addresses = '127.0.0.1'
port = ${POSTGRES_PORT}
max_connections = 50
wal_level = replica
archive_mode = on
archive_command = '/usr/src/app/docker/pod/archive-wal.sh %p %f'
archive_timeout = 60
# Fresh zero-filled segments compress well; recycled ones carry old bytes.
wal_recycle = off
